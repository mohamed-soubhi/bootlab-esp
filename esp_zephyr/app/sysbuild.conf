# Sysbuild configuration for bootlab-esp Zephyr target
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y

# ECDSA-P256 signature verification in MCUboot (software verification, 0 eFuses burned)
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="/home/msoubhi/bootlab-esp/keys/zephyr_p256.pem"
