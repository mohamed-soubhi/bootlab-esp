[pytest]
testpaths = host/tests tests_hil
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    idf: Tests targeting the ESP-IDF board (lab-esp-idf)
    zephyr: Tests targeting the Zephyr board (lab-esp-zephyr)
    ble: Tests using BLE transport
    wifi: Tests using WiFi / HTTPS transport
    udp: Tests using UDP transport
    labid: Tests exercising LABID framing and protocol
    slow: Long-running tests (e.g., soak tests)
    power: Tests requiring a switchable USB power hub (PLAN §8 T17)
