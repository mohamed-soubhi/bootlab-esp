# bootlab-esp — Zephyr west manifest (pinned)
# Board #1: Zephyr + MCUboot (sysbuild) + mcumgr/SMP.
# Zephyr pinned to v4.4.2 (latest 4.4.x). MCUboot comes from Zephyr's west
# manifest; resolved revision recorded after `west update` (see versions.env).
manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.4.2
      import: true
  self:
    path: .
