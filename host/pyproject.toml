[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labflash"
version = "0.1.0"
description = "ESP32-S3 Bootloader & OTA Lab CLI (bootlab-esp host)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pyserial>=3.5",
    "esptool>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
zephyr = ["smpclient>=0.16"]

[project.scripts]
labflash = "labflash.__main__:main"

[tool.setuptools.packages.find]
include = ["labflash*"]
