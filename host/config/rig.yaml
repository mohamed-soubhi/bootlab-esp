# bootlab-esp — HIL rig configuration (BL-005)
# Source of hardware identity + ports. See PLAN §2, §7.3.
# Two ESP32-S3 boards share VID:PID 303a:1001; distinguished by USB serial.

boards:
  zephyr:
    board_name: lab-esp-zephyr
    mcu: esp32s3
    hw: esp32s3_devkitc
    usb_serial: "AC:A7:04:2C:3B:04"     # derived from chip MAC
    dev_symlink: /dev/lab-esp-zephyr      # udev, by USB serial
    mac: "ac:a7:04:2c:3b:04"
    flash_mb: 16
    flash_mode: quad
    psram_mb: 8
    psram_mode: octal                    # CONFIRMED 2026-09-22 by esptool: Embedded PSRAM 8MB (AP_3v3), identical eFuses to idf board
    rev: v0.2
    secure_boot: off
    flash_encryption: off
    led_gpio: 48                          # CONFIRMED: ESP32-S3 DevKitC-1 v0.2 onboard WS2812 RGB LED
    led_strip: worldsemi_ws2812           # per PLAN (blink uses led_strip)
    ble_mac: "AC:A7:04:2C:3B:06"
    ip: "192.168.1.153"
    udp_port: 1337

  idf:
    board_name: lab-esp-idf
    mcu: esp32s3
    hw: esp32s3_devkitc
    usb_serial: "E0:72:A1:AA:23:90"
    dev_symlink: /dev/lab-esp-idf
    mac: "e0:72:a1:aa:23:90"
    flash_mb: 16
    flash_mode: quad
    psram_mb: 8
    psram_mode: octal                    # CONFIRMED 2026-09-21 by booting an Octal-PSRAM build: octal_psram driver read
                                          # vendor AP, 64 Mbit, 3V; "Found 8MB PSRAM device", memory test OK (BL-005)
    rev: v0.2
    secure_boot: off
    flash_encryption: off
    led_gpio: 48                          # CONFIRMED 2026-09-20 via physical power-cycle
                                           # test (BL-020); see PLAN Sec 9 R14 -- GPIO38
                                           # was tried based on a false signal caused by
                                           # R14's reset-into-bootloader behavior
    led_strip: worldsemi_ws2812
