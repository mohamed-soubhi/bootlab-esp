name: build.yml (Cloud CI)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forbidden-config-grep:
    name: Forbidden Config & Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run forbidden config grep checks
        run: bash scripts/check_forbidden_configs.sh

  labid-tests:
    name: LABID Unit & Fuzz Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang

      - name: Build and run LABID Unity tests
        run: |
          if [ ! -d common/labid/tests/unity/src ]; then
            git clone --depth 1 https://github.com/ThrowTheSwitch/Unity.git common/labid/tests/unity
          fi
          cmake -B common/labid/tests/build common/labid/tests
          cmake --build common/labid/tests/build
          ctest --test-dir common/labid/tests/build --output-on-failure

      - name: Build and run libFuzzer smoke test
        run: |
          mkdir -p common/labid/tests/fuzz_corpus
          clang -g -O1 -fsanitize=fuzzer,address,undefined -std=c99 \
            -I common/labid/include \
            common/labid/tests/fuzz_labid.c common/labid/src/labid.c \
            -o fuzz_smoke
          ./fuzz_smoke -runs=1000 common/labid/tests/fuzz_corpus

  host-unit-tests:
    name: Python Host Tool Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e host pytest pytest-cov ruff mypy types-pyserial types-PyYAML pyyaml pyserial bleak esp-idf-nvs-partition-gen esptool "smpclient>=0.16"

      - name: Lint and type check (BL-046)
        run: |
          ruff check host/
          mypy host/

      - name: Run host unit tests with coverage
        run: |
          PYTHONPATH=host pytest --cov=host/labflash --cov-fail-under=80 host/tests

      - name: HIL live-backend unit tests (hardware-free)
        run: |
          PYTHONPATH=host:. pytest tests_hil/test_live_backend_unit.py tests_hil/test_soak_unit.py

  idf-build:
    name: ESP-IDF Build & Sign (All Variants)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate CI test keys & TLS certs
        run: |
          . $IDF_PATH/export.sh
          mkdir -p keys
          chmod 700 keys
          espsecure generate-signing-key --version 2 --scheme rsa3072 keys/idf_sbv2.pem
          espsecure generate-signing-key --version 2 --scheme rsa3072 keys/idf_foreign.pem
          chmod 600 keys/*.pem
          bash scripts/gen_tls_certs.sh

      - name: Install host tools package
        run: |
          . $IDF_PATH/export.sh
          pip install -e host pyyaml pyserial

      - name: Build & verify all 5 IDF variants (PLAN R15)
        run: |
          . $IDF_PATH/export.sh
          PYTHONPATH=host python3 -m labflash build idf

      - name: Upload signed IDF firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: idf-firmware-variants
          path: |
            esp_idf/build/bootloader/bootloader.bin
            esp_idf/build/partition_table/partition-table.bin
            esp_idf/build/ota_data_initial.bin
            esp_idf/build/bootlab_idf_blink.bin
            esp_idf/build_v2/bootlab_idf_blink.bin
            esp_idf/build_no_confirm/bootlab_idf_blink.bin
            esp_idf/build_hang/bootlab_idf_blink.bin
            esp_idf/build_bad_sig/bootlab_idf_blink.bin
          if-no-files-found: error

  zephyr-build:
    name: Zephyr Build & Sign (All Variants)
    runs-on: ubuntu-latest
    env:
      # west.yml has self.path "." -- `west init -l .` treats THIS checkout as the manifest repo,
      # which makes west's topdir the PARENT of the checkout (verified against a real CI run):
      # zephyr/modules/bootloader land as SIBLINGS of the repo, e.g.
      # /home/runner/work/bootlab-esp/zephyr, not .../bootlab-esp/bootlab-esp/zephyr. Same layout
      # as this project's local dev setup (~/zephyrproject/zephyr next to ~/zephyrproject/.west).
      ZEPHYR_BASE: ${{ github.workspace }}/../zephyr
      ZEPHYR_TOOLCHAIN_VARIANT: cross-compile
      CROSS_COMPILE: ${{ github.workspace }}/../.espressif/tools/xtensa-esp-elf/esp-15.2.0_20251204/xtensa-esp-elf/bin/xtensa-esp32s3-elf-
      ESPRESSIF_TOOLS_PATH: ${{ github.workspace }}/../.espressif
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build device-tree-compiler gperf ccache dfu-util \
            file wget xz-utils make gcc g++

      - name: Install west and Python Zephyr deps
        run: |
          pip install --upgrade pip
          pip install west imgtool

      - name: west init + update (pinned to west.yml's zephyr v4.4.2)
        run: |
          west init -l .
          west update --narrow -o=--depth=1

      - name: Install Zephyr's own Python requirements
        run: |
          pip install -r "$ZEPHYR_BASE/scripts/requirements.txt"
          # zephyr/soc/espressif/common/CMakeLists.txt requires esptool>=5.0.2 on PATH (not in requirements.txt)
          pip install "esptool>=5.0.2"

      - name: Fetch HAL blobs (hal_espressif) and the Xtensa toolchain directly from crosstool-NG
        run: |
          west blobs fetch hal_espressif
          # hal_espressif has no bundled installer script (checked: modules/hal/espressif/tools/
          # only has ci/idf_monitor/sync, no toolchain installer) -- the xtensa-esp-elf toolchain
          # is Espressif's crosstool-NG release, downloaded directly by version tag.
          TC_VER="esp-15.2.0_20251204"
          mkdir -p "$ESPRESSIF_TOOLS_PATH/tools/xtensa-esp-elf/$TC_VER"
          wget -q "https://github.com/espressif/crosstool-NG/releases/download/${TC_VER}/xtensa-esp-elf-15.2.0_20251204-x86_64-linux-gnu.tar.xz" \
            -O /tmp/xtensa-esp-elf.tar.xz
          # The tarball's top-level directory is xtensa-esp-elf/ (bin/xtensa-esp32s3-elf-gcc lives under it) and
          # CROSS_COMPILE expects $TC_VER/xtensa-esp-elf/bin/..., so extract WITHOUT --strip-components.
          tar xf /tmp/xtensa-esp-elf.tar.xz -C "$ESPRESSIF_TOOLS_PATH/tools/xtensa-esp-elf/$TC_VER"
          test -x "${CROSS_COMPILE}gcc" || { echo "toolchain compiler not found: ${CROSS_COMPILE}gcc"; ls "$ESPRESSIF_TOOLS_PATH/tools/xtensa-esp-elf/$TC_VER"; exit 1; }

      - name: Generate CI test keys (ECDSA-P256, Zephyr/MCUboot)
        run: |
          mkdir -p keys
          chmod 700 keys
          imgtool keygen -k keys/zephyr_p256.pem -t ecdsa-p256
          imgtool keygen -k keys/zephyr_foreign.pem -t ecdsa-p256
          chmod 600 keys/*.pem

      - name: Build & verify all 5 Zephyr variants
        working-directory: esp_zephyr/app
        run: |
          set -e
          declare -A OVERLAYS=(
            [v1]=overlay_v1.conf [v2]=overlay_v2.conf [hang]=overlay_hang.conf
            [no_confirm]=overlay_no_confirm.conf [bad_sig]=overlay_bad_sig.conf
          )
          declare -A KEY_FILES=(
            [v1]="$GITHUB_WORKSPACE/keys/zephyr_p256.pem" [v2]="$GITHUB_WORKSPACE/keys/zephyr_p256.pem"
            [hang]="$GITHUB_WORKSPACE/keys/zephyr_p256.pem" [no_confirm]="$GITHUB_WORKSPACE/keys/zephyr_p256.pem"
            [bad_sig]="$GITHUB_WORKSPACE/keys/zephyr_foreign.pem"
          )
          for variant in v1 v2 hang no_confirm bad_sig; do
            echo "::group::Building $variant"
            # Override SB_CONFIG_BOOT_SIGNATURE_KEY_FILE at the command line -- the committed
            # sysbuild.conf hardcodes an absolute dev-machine path that doesn't exist in CI
            # (see docs/LESSONS_LEARNED.md Trap 16-style issue: don't edit the file used by the
            # live board workflow, override per-invocation instead).
            # Kconfig STRING options need literal embedded quotes in the -D value, or the
            # generated extra_kconfig_options.conf line is unquoted and Kconfig rejects it
            # ("malformed string literal") -- verified against a real CI run.
            west build -b esp32s3_devkitc/esp32s3/procpu . -d "build_ci_${variant}" --sysbuild -p always -- \
              -Dapp_EXTRA_CONF_FILE="${OVERLAYS[$variant]}" \
              -DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE=\"${KEY_FILES[$variant]}\"
            test -s "build_ci_${variant}/app/zephyr/zephyr.signed.bin"
            echo "::endgroup::"
          done

      - name: Upload signed Zephyr firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-firmware-variants
          path: |
            esp_zephyr/app/build_ci_v1/mcuboot/zephyr/zephyr.bin
            esp_zephyr/app/build_ci_v1/app/zephyr/zephyr.signed.bin
            esp_zephyr/app/build_ci_v2/app/zephyr/zephyr.signed.bin
            esp_zephyr/app/build_ci_hang/app/zephyr/zephyr.signed.bin
            esp_zephyr/app/build_ci_no_confirm/app/zephyr/zephyr.signed.bin
            esp_zephyr/app/build_ci_bad_sig/app/zephyr/zephyr.signed.bin
          if-no-files-found: error
